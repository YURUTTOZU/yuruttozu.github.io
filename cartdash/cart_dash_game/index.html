function updateVisibleViewport(){

function syncOrientationGate(){
  if(isMobilePortrait()){
    showRotatePrompt();
    document.body.classList.add('portraitLocked');

  }
  document.body.classList.remove('portraitLocked');
  hideRotatePrompt();
  updateVisibleViewport();
}

function draw(){ctx.clearRect(0,0,1280,720);if(bg.length){let im=bg[bgIndex],w=cover(im,-bgOffset);cover(im,w-bgOffset);cover(im,w*2-bgOffset)}if(platformImg){for(let p of platforms)ctx.drawImage(platformImg,p.x,p.top,p.w,p.h)}for(let o of obstacles){let oy=ground-o.h;if(o.platformId){let pp=platforms.find(p=>p.id===o.platformId);if(pp)oy=pp.top-o.h+8}ctx.drawImage(obsImgs[o.idx],o.x,oy,o.w,o.h);}for(let it of collectibles){let im=itemImgs[selected];if(im){ctx.save();const pulse=14+8*(.5+.5*Math.sin(performance.now()/150));ctx.shadowColor='#fff36a';ctx.shadowBlur=pulse;ctx.drawImage(im,it.x,it.y,it.w,it.h);ctx.shadowColor='#ffffff';ctx.shadowBlur=8;ctx.drawImage(im,it.x,it.y,it.w,it.h);ctx.restore()}}let h=heroes[selected];if(h)ctx.drawImage(h,115,ground-heroH-y,heroW,heroH)}const resultCharacterSrc={kyabecchi:'assets/result_kyabecchi.png',ajihei:'assets/result_ajihei.png',uinta:'assets/result_uinta.png',koromi:'assets/result_koromi.png',panna:'assets/result_panna.png',tamachan:'assets/result_tamachan.png',senbei:'assets/result_senbei.png',aimy:'assets/result_aimy.png'};

function gameOver(){running=false;stopAudio(audio.game);playAudio(audio.over,true);let d=Math.floor(distance),pts=d*itemCount;final.textContent=d;finalItemName.textContent=itemInfo[selected].name;finalItems.textContent=itemCount;finalCalc.textContent=d.toLocaleString('ja-JP')+'m × '+itemCount+'個';finalPoints.textContent=pts.toLocaleString('ja-JP');const resultRank=saveScore(selected,d,itemCount);showResultCharacter(resultRank);over.classList.remove('hide')}function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;let speed=currentSpeed();distance+=dt*10;score.textContent=Math.floor(distance);distanceLive.textContent=Math.floor(distance);
 const prevBottom=ground-y;
 vy-=1900*dt;y+=vy*dt;
 let heroLeft=115,heroRight=115+heroW,newBottom=ground-y,landed=false;
 if(vy<=0){for(let p of platforms){if(heroRight>p.x+8&&heroLeft<p.x+p.w-8&&prevBottom<=p.top+8&&newBottom>=p.top){y=ground-p.top;vy=0;jumpCount=0;landed=true;break}}}
 if(!landed&&y<0){y=0;vy=0;jumpCount=0}
 // 平台の端から出たら、そのまま床へ落下する

 bgOffset+=speed*dt;if(bg.length){let s=1280/bg[bgIndex].width,w=bg[bgIndex].width*s;if(bgOffset>=w){bgOffset%=w;bgIndex=0}}

for(let o of obstacles){
 let oy=ground-o.h;if(o.platformId){let pp=platforms.find(p=>p.id===o.platformId);if(pp)oy=pp.top-o.h+8}const m=obstacleShapeMasks[o.idx];
 const gy0=Math.max(0,Math.floor((p.y-oy)/o.h*obstacleMaskN));

}draw();requestAnimationFrame(loop)}home.addEventListener('pointerdown',unlockAudio,{once:true});startHot.onclick=begin;retry.onclick=begin;back.onclick=goHome;homeBtn.onclick=goHome;C.addEventListener('pointerdown',()=>{ensureGameMusic();jump()});window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&gameScreen.style.display==='block'){e.preventDefault();jump()}});syncOrientationGate();draw();
