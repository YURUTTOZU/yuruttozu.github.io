<script>
const names=["きゃべっち", "パンナ", "あじへい", "ういんた", "コロミさん", "たまちゃん", "せんべえ", "アイミー"];let selected=null,next=1,running=false,startAt=0,raf=0;
const $=id=>document.getElementById(id), show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)};

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function board(){
 let g=$('grid');g.innerHTML='';
 if(selected!==null&&window.clearCharacterImages){
   g.style.setProperty('--grid-character','url("'+window.clearCharacterImages[selected]+'")');
 }
 shuffle([...Array(25)].map((_,i)=>i+1)).forEach(n=>{
   let b=document.createElement('button');b.className='num';b.textContent=n;
   b.onclick=()=>tap(b,n);g.appendChild(b)
 })
}
function tap(b,n){if(!running)return;if(n===next){playSfx('audioCorrect');b.classList.add('done','revealed');next++;$('next').textContent=next<=25?next:'✓';if(next===26)finish()}else{playSfx('audioWrong');b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),150)}}
function tick(){if(!running)return;$('time').textContent=((performance.now()-startAt)/1000).toFixed(2);raf=requestAnimationFrame(tick)}
function restart(){cancelAnimationFrame(raf);next=1;running=false;$('next').textContent='1';$('time').textContent='0.00';$('result').style.display='none';board()}
function play(){if(selected===null){$('pick').textContent='先にキャラクターを選んでね！';return}$('chosen').textContent=names[selected]+'と挑戦！';show('game');restart()}
function finish(){
 running=false;cancelAnimationFrame(raf);playSceneMusic('clear');
 let t=(performance.now()-startAt)/1000;
 $('final').textContent=t.toFixed(2)+'秒';
 $('clearCharacter').src=window.clearCharacterImages[selected];
 $('clearCharacter').classList.toggle('fitWholeBody',selected===5||selected===7);

 $('clearCharacterWrap').classList.toggle('sizeMatchWrap',selected===4||selected===6);
 $('msg').textContent='';

 let r=JSON.parse(localStorage.getItem('kunugiyaNT')||'[]');
 let record={t,n:names[selected]};
 r.push(record);
 r.sort((a,b)=>a.t-b.t);
 let rank=r.indexOf(record)+1;
 localStorage.setItem('kunugiyaNT',JSON.stringify(r.slice(0,10)));

 const first=[
  'やったー！1位だよ！ ねぇねぇ、もう1回やってみよ！',
  'よっしゃあ！！1位だ！ たいしたもんだぜ！',

  'ワオ！！1位デス！ ニッポンイチですね〜！✨'
 ];
 const top10=[
  `やったー！今回は ${rank}位 だよ！`,
  `よっしゃあ！${rank}位だ！ やるじゃねぇか！`,
  `やったー！！${rank}位だよ！ すごーい！`,
  `聞いて聞いて！なんと ${rank}位 だって！`,
  `すごいね♪ ${rank}位 に入ったよ！`,
  `わぁ〜、${rank}位だって〜。すごいね〜`,
  `ほっほっ、${rank}位じゃ。よくやったのぉ`,
  `ワオ！${rank}位！ これがニッポンのランキングですね！`
 ];
 const outside=[
  '今回はランキング外！ もう1回やってみよー！',
  'ランキング外かぁ！ 次はいけるって！',
  'ランキング外！ つぎはもっとがんばろー！',
  '今回はランキング外だって！ 次こそね！',
  'ランキング外だったよ。でも、もう1回いこ♪',
  'ランキング外だって〜。またのんびりいこ〜',
  '今回はランキング外じゃ。また挑戦じゃな',
  'ランキング外！？ ニッポンのランキング、むずかしいデス！'
 ];

 let speech=$('rankSpeech');
 speech.className='rankSpeech charSpeech'+selected+(rank===1?' firstPlace':'');
 speech.textContent=rank===1?first[selected]:(rank<=10?top10[selected]:outside[selected]);
 $('result').style.display='block';
}
function rankings(){let r=JSON.parse(localStorage.getItem('kunugiyaNT')||'[]');$('rankList').innerHTML=r.length?r.map((x,i)=>`<div class="rankrow"><span>${i+1}位</span><span>${Number(x.t).toFixed(2)}秒</span><span>${x.n}</span></div>`).join(''):'<div class="empty">まだ記録はありません</div>';show('ranking')}
$('start').onclick=play;$('rankBtn').onclick=rankings;$('rankHome').onclick=()=>{show('home')};$('retry').onclick=()=>{restart();countdownThenStart()};$('again').onclick=()=>{restart();countdownThenStart()};$('gameHome').onclick=()=>{running=false;cancelAnimationFrame(raf);show('home');playSceneMusic('home')};$('resultHome').onclick=()=>{running=false;cancelAnimationFrame(raf);show('home');playSceneMusic('home')};board();
</script><script>window.clearCharacterImages=["assets/character_01.png","assets/character_02.png","assets/character_03.png","assets/character_04.png","assets/character_05.png","assets/character_06.png","assets/character_07.png","assets/character_08.png"];

  const sync=()=>{ if(img && typeof selected!=='undefined' && selected>=0){img.src=window.clearCharacterImages[selected];img.classList.toggle('fitWholeBody',selected===5||selected===7);img.classList.toggle('clearLarge',selected===0||selected===1);img.classList.toggle('sizeMatch',selected===4||selected===6);document.getElementById('clearCharacterWrap').classList.toggle('sizeMatchWrap',selected===4||selected===6);} };

  obs.observe(document.body,{attributes:true,subtree:true,attributeFilter:['style','class']});

  function stop(id,reset=true){
    const a=el(id); if(!a)return;
    a.pause(); if(reset){try{a.currentTime=0}catch(e){}}
  }
  window.stopAllAudio=function(){
    allIds.forEach(id=>stop(id));
  };
  window.playSfx=function(id){
    if(!soundOn)return;
    const a=el(id); if(!a)return;
    // Each tap gets its own audio instance so rapid correct taps can overlap
    // instead of restarting/cutting off the previous sound.
    const sfx = new Audio(a.currentSrc || a.src);
    sfx.volume = a.volume;
    sfx.play().catch(()=>{});
  };
  window.playSceneMusic=function(scene){
    musicIds.forEach(id=>stop(id));
    if(!soundOn)return;
    const map={home:'audioHome',game:'audioGame',clear:'audioClear'};
    const a=el(map[scene]); if(!a)return;
    a.volume = scene==='home' ? .48 : scene==='game' ? .52 : .50;
    a.play().catch(()=>{});
  };
  function updateButton(){
    const b=el('soundToggle'); if(b)b.textContent=soundOn?'🔊 サウンド ON':'🔇 サウンド OFF';
  }
  const toggle=el('soundToggle');
  if(toggle) toggle.addEventListener('click',function(e){
    e.stopPropagation();
    soundOn=!soundOn;
    localStorage.setItem('kunugiyaSound',soundOn?'on':'off');
    updateButton();
    if(!soundOn) stopAllAudio();
    else playSceneMusic(document.getElementById('game')?.classList.contains('active')?'game':'home');
  });
  updateButton();

  // Browsers require one user interaction before audio can begin.
  const unlock=function(){
    if(soundOn && document.getElementById('home')?.classList.contains('active')) playSceneMusic('home');
    document.removeEventListener('pointerdown',unlock);
    document.removeEventListener('keydown',unlock);
  };
  document.addEventListener('pointerdown',unlock);
  document.addEventListener('keydown',unlock);
})();
</script>

<script>
(function(){
 const startBtn=document.getElementById('start');
 const retryBtn=document.getElementById('retry');
 const overlay=document.getElementById('countdownOverlay');
 const txt=document.getElementById('countdownText');
 if(!overlay||!txt) return;

 window.countdownThenStart=function(){
   running=false;
   if(window.stopAllAudio) window.stopAllAudio();
   cancelAnimationFrame(raf);
   $('time').textContent='0.00';
   overlay.classList.add('show');
   const seq=['3','2','1','スタート！'];
   let i=0;
   function step(){
     txt.textContent=seq[i];
     txt.classList.toggle('startWord',i===3);
     txt.style.animation='none'; void txt.offsetWidth;
     txt.style.animation='countPop .7s ease both';
     if(i<3){ i++; setTimeout(step,1000); }
     else{
       setTimeout(()=>{
         overlay.classList.remove('show');
         txt.classList.remove('startWord');
         startAt=performance.now();
         if(window.playSceneMusic) window.playSceneMusic('game');
         running=true;
         $('time').textContent='0.00';
         raf=requestAnimationFrame(tick);
       },700);
     }
   }
   // iPhoneで効果音がわずかに遅れて聞こえる分だけ、音を100ms先行させる。
   // 表示テンポ（3・2・1・スタート！の1秒間隔）はそのまま。
   if(window.playSfx) window.playSfx('audioCountdown');
   setTimeout(step,100);
 }
 if(startBtn) startBtn.addEventListener('click',()=>{
   // キャラクター未選択ならホームのまま。BGMもホームBGMを継続する。

 });
 
})();

<script id="iphone-independent-status-sync">
(function(){

  sync();
})();
